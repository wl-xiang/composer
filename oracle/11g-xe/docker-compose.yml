# Oracle Database 11g Express Edition (XE) 部署(优化镜像)
#
# 镜像:基于 oracleinanutshell/oracle-xe-11g 二次构建的本地优化镜像(仅用于开发/测试)
# 优化内容:
#   1. sqlplus/expdp 等工具加入 PATH,docker exec 可直接调用;
#   2. entrypoint 等待数据库 OPEN 后输出 "Database ready to use. Enjoy ;)",
#      替代原镜像只打印 "Starting ..." 而无就绪提示的问题;
#   3. 预置业务用户 oracle1/oracle1(拥有 DBA 全权限),与 system 分离,开箱即用。
# 说明:
#   1. Oracle 官方未提供 11g 镜像,base 为社区镜像,生产环境请改用受支持的版本并自行解决授权。
#   2. XE 数据库的 ORACLE_BASE 为 /u01/app/oracle,数据文件位于 /u01/app/oracle/oradata/XE。
#   3. 只挂载 oradata 子目录,不要挂载整个 ORACLE_BASE,否则会遮蔽镜像内的 Oracle 程序目录导致启动失败。
#   4. privileged: true 为 XE 镜像启动所需,不可删除。
#
# 使用前请复制 .env.example 为 .env 并按需修改。

name: oracle-11g-xe

services:
  oracle:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ORACLE_XE_IMAGE:-oracle-xe-11g:1.0.0}
    container_name: ${ORACLE_XE_CONTAINER_NAME:-oracle-11g-xe}
    privileged: true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped
    ports:
      - "${ORACLE_XE_PORT:-1521}:1521"
    volumes:
      # 数据库数据文件(数据持久化)
      - ${ORACLE_XE_ORADATA_DIR:-./volumes/oradata}:/u01/app/oracle/oradata
      # Data Pump(expdp/impdp)导入导出目录,需与宿主机共享
      - ${ORACLE_XE_DUMP_DIR:-./volumes/dump}:/u01/app/oracle/dpdump
      # 自定义初始化 SQL(可选,首次挂载后每次启动都会执行)
      # - ${ORACLE_XE_INIT_DIR:-./volumes/initdb}:/docker-entrypoint-initdb.d
