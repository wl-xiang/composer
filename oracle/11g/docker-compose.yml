# Oracle Database 11g Enterprise Edition 部署(优化镜像)
#
# 镜像:基于 yycx/oracle11:11.2.0.4 二次构建的本地优化镜像(仅用于开发/测试,体积约 7.35GB)
# 优化内容:
#   1. entrypoint 自动探测 ORACLE_HOME/SID,等待数据库 OPEN 后输出
#      "Database ready to use. Enjoy ;)",便于判断启动成功;
#   2. 预置业务用户 oracle1/oracle1(拥有 DBA 全权限),与 system 分离,开箱即用;
#   3. 容器内 sqlplus 加入 PATH(sqlplus 在 oracle 用户 profile 中,root 下需 su - oracle)。
# 说明:
#   1. Oracle 官方未提供 11g 镜像,base 为社区镜像,生产环境请改用受支持的版本并自行解决授权。
#   2. 实例 SID 为 orcl,数据文件位于 /opt/oracle/app/oradata/orcl,
#      快速恢复区位于 /opt/oracle/app/fast_recovery_area/orcl。
#   3. privileged: true 为该镜像启动所需,不可删除。
#   4. 所有数据一律使用宿主机本地目录映射(./volumes/xxx),不使用 Docker 具名卷,
#      统一在本仓库 ./volumes/ 下管理,便于备份与迁移。
#
# 使用前请复制 .env.example 为 .env 并按需修改。

name: oracle-11g

services:
  oracle:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ORACLE_IMAGE:-oracle-11g:1.0.0}
    container_name: ${ORACLE_CONTAINER_NAME:-oracle-11g}
    privileged: true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped
    ports:
      # 宿主机 1522 → 容器 1521,与 oracle/11g-xe 服务的 1521 区分开,避免同时部署时冲突
      - "${ORACLE_PORT:-1522}:1521"
    volumes:
      # 数据文件
      - ${ORACLE_ORADATA_DIR:-./volumes/oradata}:/opt/oracle/app/oradata/orcl
      # 快速恢复区(FRA)
      - ${ORACLE_FRA_DIR:-./volumes/fra}:/opt/oracle/app/fast_recovery_area/orcl
      # Data Pump(expdp/impdp)导入导出目录
      - ${ORACLE_DUMP_DIR:-./volumes/dump}:/opt/oracle/dpdump
