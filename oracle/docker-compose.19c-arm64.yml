# Oracle Database 19c 预置镜像部署(仅 arm64,社区构建,基于 Oracle 官方 ARM64 安装包)。
# 预置:用户 dev/dev@1234、表空间 TS_DEV、临时表空间 TS_DEV_TMP、样例表 DEV.T_DEV_EXAMPLE(建在 ORCLPDB1)。
# 管理员 system/SYS 密码为 ORACLE_19C_SYS_PASSWORD(仅首次建库时生效)。
name: oracle-19c-arm64

services:
  oracle-prep:
    build:
      context: .
      dockerfile: Dockerfile.19c-arm64
    image: ${ORACLE_19C_IMAGE:-oracle-19c-arm64-preset:1.0.0}
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/oracle/oradata
        chown -R 54321:54321 /opt/oracle/oradata || echo "prep: WARN: chown failed"
        echo "prep: ./volumes/oradata owner set to 54321:54321"
    volumes:
      - ${ORACLE_19C_ORADATA_DIR:-./volumes/oradata}:/opt/oracle/oradata
    restart: "no"

  oracle:
    build:
      context: .
      dockerfile: Dockerfile.19c-arm64
    image: ${ORACLE_19C_IMAGE:-oracle-19c-arm64-preset:1.0.0}
    container_name: ${ORACLE_19C_CONTAINER_NAME:-oracle-19c-arm64}
    hostname: oracle19c
    restart: unless-stopped
    depends_on:
      oracle-prep:
        condition: service_completed_successfully
    stop_grace_period: 180s
    shm_size: 1g
    mem_limit: ${ORACLE_19C_MEM_LIMIT:-4g}
    ports:
      - "${ORACLE_19C_PORT:-1523}:1521"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ORACLE_PWD: ${ORACLE_19C_SYS_PASSWORD:-SysOracle123}
    volumes:
      - ${ORACLE_19C_ORADATA_DIR:-./volumes/oradata}:/opt/oracle/oradata
    healthcheck:
      test:
        - CMD-SHELL
        - |
          { echo 'whenever sqlerror exit 1'; echo 'select 1 from dual;'; echo exit; } | sqlplus -s system/${ORACLE_19C_SYS_PASSWORD:-SysOracle123}
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 900s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
