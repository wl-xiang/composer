# Gitea + PostgreSQL 部署
# 基于官方文档: https://docs.gitea.com/installation/install-with-docker/#postgresql-database
#
# 使用前请复制 .env.example 为 .env 并按需修改(尤其是数据库密码)。

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:${GITEA_VERSION:-28.2.0}
    container_name: gitea
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB:-gitea}
      - GITEA__database__USER=${POSTGRES_USER:-gitea}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:-gitea}
    restart: always
    networks:
      - gitea
    volumes:
      - ${GITEA_DATA_DIR:-./gitea}:/data
      # /etc/timezone 和 /etc/localtime 仅存在于 Linux 宿主机,
      # macOS/Windows 上部署时请注释掉这两行。
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:${POSTGRES_VERSION:-18}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gitea}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gitea}
      - POSTGRES_DB=${POSTGRES_DB:-gitea}
    networks:
      - gitea
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitea} -d ${POSTGRES_DB:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
